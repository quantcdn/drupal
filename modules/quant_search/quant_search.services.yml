services:
  quant_search.output.api:
    class: Drupal\quant_search\EventSubscriber\SearchEventSubscriber
    arguments:
      - '@logger.factory'
      - '@event_dispatcher'
    tags:
      - { name: 'event_subscriber' }

  quant_search.backend:
    class: Drupal\quant_search\SearchBackend
    arguments:
      - '@quant_api.client'
      - '@config.factory'
      - '@cache.default'
      - '@logger.factory'

  quant_search.page_publisher:
    class: Drupal\quant_search\SearchPagePublisher
    arguments:
      - '@quant_search.backend'
      - '@router.builder'
      - '@quant_api.credentials'
      - '@config.factory'
      - '@state'
      - '@logger.factory'
      - '@quant_api.push_failures'
      - '@entity_type.manager'
      - '@event_dispatcher'
      - '@request_stack'

  quant_search.view_converter:
    class: Drupal\quant_search\ViewSearchPageConverter
    arguments:
      - '@entity_type.manager'
      - '@language_manager'
      - '@quant_search.backend'

  quant_search.facet_proposer:
    class: Drupal\quant_search\FacetProposer
    arguments:
      - '@entity_type.manager'
      - '@entity_field.manager'
      - '@language_manager'

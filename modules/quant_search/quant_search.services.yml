services:
  quant_search.search_page_repository:
    class: Drupal\quant_search\SearchPageRepository
    arguments: ['@config.factory', '@entity_type.manager']

  quant_search.output.api:
    class: Drupal\quant_search\EventSubscriber\SearchEventSubscriber
    arguments:
      - '@logger.factory'
      - '@event_dispatcher'
    tags:
      - { name: 'event_subscriber' }

  quant_search.backend:
    class: Drupal\quant_search\SearchBackend
    arguments:
      - '@quant_api.client'
      - '@config.factory'
      - '@cache.default'
      - '@logger.factory'

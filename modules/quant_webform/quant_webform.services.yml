services:
  quant_webform.mapper:
    class: Drupal\quant_webform\QuantFormsMapper
    arguments: ['@config.factory', '@module_handler', '@keyvalue', '@plugin.manager.webform.element']

  quant_webform.registrar:
    class: Drupal\quant_webform\QuantFormsRegistrar
    arguments: ['@entity_type.manager', '@entity_field.manager', '@quant_api.client', '@quant_webform.registry']

  quant_webform.report:
    class: Drupal\quant_webform\QuantFormsReport
    arguments: ['@quant_webform.mapper', '@quant_webform.registrar']

  quant_webform.subscriber:
    class: Drupal\quant_webform\EventSubscriber\QuantFormsSubscriber
    arguments: ['@entity_type.manager', '@quant_webform.mapper', '@logger.factory', '@quant_webform.registry']
    tags:
      - { name: event_subscriber }

  quant_webform.page_cache_request_policy:
    class: Drupal\quant_webform\PageCache\ExportRequestPolicy
    tags:
      - { name: page_cache_request_policy }

  cache_context.quant_export:
    class: Drupal\quant_webform\Cache\ExportCacheContext
    tags:
      - { name: cache.context }

  quant_webform.registry:
    class: Drupal\quant_webform\QuantFormsRegistry
    arguments: ['@keyvalue']

  quant_webform.settings_section:
    class: Drupal\quant_webform\QuantFormsSettingsSection
    arguments: ['@quant_webform.mapper', '@quant_webform.report', '@email.validator']
